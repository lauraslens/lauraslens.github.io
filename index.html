<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf8"><meta name="description" content="Laura’s Lens. Heartland Human: Raised in Kansas. Based in Prague. Art reviews, type and works in progress."><title>Laura’s Lens</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--paper:#fafaf8;--ink:#171717;--line:#b8b8b3;--muted:#64645f;--rainbow:linear-gradient(90deg,#f34842 0 16.66%,#ff9e31 16.66% 33.33%,#f4d745 33.33% 50%,#4da36b 50% 66.66%,#497ad1 66.66% 83.33%,#a172b6 83.33%)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 'DM Sans',Arial,sans-serif}a{color:inherit;text-underline-offset:5px}button,input,textarea,select{font:inherit;color:inherit}button,a,input,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #497ad1;outline-offset:5px}.site{max-width:1800px;padding:0 4.5vw;margin:auto}header{height:112px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);gap:24px}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;letter-spacing:.055em;text-decoration:none}.mini-lens{display:block;width:25px;height:25px;border:1.5px solid;border-radius:50%;position:relative}.mini-lens:after{content:'';position:absolute;inset:5px;border:1.5px solid;border-radius:50%}nav{display:flex;gap:38px}nav a{font-size:16px;text-decoration:none}nav a:hover,nav a[aria-current=page]{text-decoration:underline}main{min-height:calc(100svh - 220px)}.home{padding:50px 0 0}.eyebrow{font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0}.hero{display:grid;grid-template-columns:1fr 32%;align-items:center;padding:30px 0 50px;gap:2vw}.hero h1{font-family:'Space Grotesk',Arial,sans-serif;font-size:clamp(90px,12.7vw,220px);font-weight:500;line-height:.83;letter-spacing:-.085em;margin:20px 0 36px}.hero h1>span{display:block}.subhead{font-size:clamp(17px,1.6vw,25px);max-width:650px;margin:0;letter-spacing:-.025em}.lens-art{aspect-ratio:1;position:relative;margin:25px 0}.lens-art svg{width:100%;height:100%;overflow:visible}.lens-art .lens-inner{transform-origin:200px 200px;animation:turn 28s linear infinite}.lens-art:after{content:'A SHIFT IN PERSPECTIVE';position:absolute;bottom:-20px;right:0;font-size:12px;letter-spacing:.1em}.rainbow-rule{height:6px;background:var(--rainbow);width:100%}.intro-line{display:flex;justify-content:space-between;align-items:start;padding:25px 0 30px;gap:30px;border-top:1px solid var(--ink)}.intro-line p{margin:0;max-width:450px;font-size:19px}.intro-line span{font-size:14px}.sections{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:8px 0 60px}.section-link{padding:24px 25px 25px 0;text-decoration:none;position:relative;min-height:145px}.section-link+.section-link{border-left:1px solid var(--line);padding-left:28px}.section-link h2{font:500 clamp(28px,3vw,48px)/1.2 'Space Grotesk',Arial,sans-serif;letter-spacing:-.05em;margin:8px 0}.section-link p{font-size:15px;color:var(--muted);margin:0}.section-link:hover h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}.asterisk{font-size:38px;line-height:1;display:inline-block;vertical-align:middle;margin-left:12px}.page{padding:55px 0 70px}.page-heading{display:flex;justify-content:space-between;align-items:end;gap:25px;border-bottom:1px solid;padding-bottom:35px;margin-bottom:35px}.page h1{font:500 clamp(62px,8vw,130px)/1 'Space Grotesk',Arial,sans-serif;letter-spacing:-.065em;margin:22px 0 0}.page-heading p{margin:0;max-width:300px;color:var(--muted)}.empty{min-height:300px;display:flex;align-items:center;gap:45px}.empty-mark{font:400 110px/1 'Space Grotesk',sans-serif}.empty h2{font:500 30px/1.2 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin:0 0 10px}.empty p{margin:0;color:var(--muted)}.soon{min-height:65svh;display:flex;flex-direction:column;justify-content:center;align-items:start}.soon h1{font-size:clamp(90px,16vw,220px)}.soon .rainbow-rule{width:110px;margin:30px 0}.soon p{font-size:25px;margin:0}.tags{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 35px}.tag{border:1px solid var(--line);background:transparent;border-radius:0;padding:5px 12px;text-decoration:none;font-size:14px}.tag.active,.tag:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:45px}.post-card{border-bottom:1px solid var(--line);padding-bottom:30px}.post-card>a{text-decoration:none}.post-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;margin-bottom:20px}.post-card h2{font:500 35px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin:12px 0}.post-card>a:hover h2{text-decoration:underline}.post-meta{font-size:14px;color:var(--muted)}.post-card p{margin:14px 0}.post-body{max-width:800px;margin:45px auto}.post-body h1{font-size:clamp(45px,6vw,80px)}.post-body .body-copy{white-space:pre-wrap;margin:35px 0;font-size:19px;line-height:1.8}.post-body figure{margin:35px 0}.post-body img{width:100%;height:auto;display:block}.post-body figcaption{font-size:14px;color:var(--muted);margin-top:10px}footer{border-top:1px solid var(--ink);display:flex;justify-content:space-between;gap:20px;padding:24px 0 28px;font-size:13px;color:var(--muted)}footer a{font-size:14px}.skip{position:fixed;top:-100px;background:var(--ink);color:white;padding:12px;z-index:5}.skip:focus{top:0}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.lens-art .lens-inner{animation:none}}@media(max-width:700px){.site{padding:0 6vw}header{height:auto;padding:25px 0;align-items:start;flex-direction:column;gap:22px}nav{gap:28px}.home{padding-top:30px}.hero{grid-template-columns:1fr 27%;gap:0;padding-top:20px;padding-bottom:40px}.hero h1{font-size:20vw;margin:10px 0 25px}.subhead{font-size:17px;max-width:260px}.lens-art{align-self:start;margin-top:24px}.lens-art:after{display:none}.intro-line{padding:25px 0}.intro-line p{font-size:17px}.intro-line>span{display:none}.sections{grid-template-columns:1fr;margin-bottom:35px}.section-link{min-height:115px;padding:20px 0}.section-link+.section-link{border-left:0;border-top:1px solid var(--line);padding-left:0}.section-link h2{font-size:33px}.section-link p{font-size:15px}.page{padding-top:35px}.page-heading{display:block}.page-heading p{margin-top:24px}.posts{grid-template-columns:1fr;gap:30px}.empty{gap:22px;min-height:270px}.empty-mark{font-size:70px}.empty h2{font-size:26px}.soon{min-height:60svh}.footer-note{display:none}footer{font-size:12px}.post-body{margin-top:30px}}
</style></head>
<body><a class="skip" href="#main">Skip to content</a><div class="site"><header><a class="brand" href="#/" aria-label="Laura’s Lens home"><span class="mini-lens" aria-hidden="true"></span> LAURA’S LENS</a><nav aria-label="Main navigation"><a href="#/art-reviews">Art Reviews</a><a href="#/type">Type</a><a href="#/wip">WIP</a></nav></header><main id="main" tabindex="-1"></main><footer><span>© <span id="year"></span> Laura DeVito</span><span class="footer-note">A little closer. A little differently.</span><a href="editor.html">Editor</a></footer></div><script>'use strict';
const main=document.querySelector('main');
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imageURL=value=> /^(data:image\/(jpeg|png|webp|gif);base64,|https:\/\/|images\/)/i.test(value||'')?escapeHTML(value):'';
const renderBody=value=>escapeHTML(value).replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
let posts=[],loadFailed=false;
const dateLabel=value=>{const d=new Date(`${value}T12:00:00`);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});};
const lens=`<div class="lens-art" aria-hidden="true"><svg viewBox="0 0 400 400" fill="none" stroke="currentColor"><circle cx="200" cy="200" r="183" stroke-width="1"/><circle cx="200" cy="200" r="155" stroke-width="1"/><circle cx="200" cy="200" r="74" stroke-width="2"/><g class="lens-inner" stroke-width="1.2"><ellipse cx="200" cy="200" rx="143" ry="62"/><ellipse cx="200" cy="200" rx="143" ry="62" transform="rotate(60 200 200)"/><ellipse cx="200" cy="200" rx="143" ry="62" transform="rotate(120 200 200)"/></g><circle cx="200" cy="200" r="14" fill="currentColor"/><path d="M0 200H38M362 200H400M200 0V38M200 362V400"/></svg></div>`;
function render(){
 const parts=location.hash.slice(2).split('/'), page=parts[0]||'',id=parts[1];
 document.querySelectorAll('nav a').forEach(a=>{a.removeAttribute('aria-current');if(a.hash===`#/${page.split('?')[0]}`)a.setAttribute('aria-current','page');});
 document.title=(page.split('?')[0]==='art-reviews'?'Art Reviews | ':page==='type'?'Type | ':page==='wip'?'WIP | ':'')+'Laura’s Lens';
 if(!page){main.innerHTML=`<section class="home"><p class="eyebrow">Art. Letters. Life in between.</p><div class="hero"><div><h1>Laura’s<span>Lens<span class="asterisk" aria-hidden="true">✳</span></span></h1><p class="subhead">Heartland Human: Raised in Kansas. Based in Prague.</p></div>${lens}</div><div class="rainbow-rule" aria-hidden="true"></div><div class="intro-line"><p>A place for looking, making,<br>and following the interesting bits.</p><span>KANSAS ROOTS. PRAGUE POINT OF VIEW.</span></div><div class="sections"><a class="section-link" href="#/art-reviews"><h2>Art Reviews</h2><p>Looking closer. Thinking out loud.</p></a><a class="section-link" href="#/type"><h2>Type</h2><p>Letters with a little attitude. Coming soon.</p></a><a class="section-link" href="#/wip"><h2>WIP</h2><p>Still making. Still becoming. Coming soon.</p></a></div></section>`;return;}
 if(page==='type'||page==='wip'){main.innerHTML=`<section class="page soon"><p class="eyebrow">${page==='type'?'Letters with a little attitude':'Works in progress'}</p><h1>${page==='type'?'Type':'WIP'}</h1><div class="rainbow-rule" aria-hidden="true"></div><p>Coming soon.</p></section>`;return;}
 if(page==='art-reviews'){
  if(id){let post=posts.find(p=>p.id===decodeURIComponent(id));if(!post){main.innerHTML='<section class="page"><h1>Review not found.</h1><p><a href="#/art-reviews">Back to Art Reviews</a></p></section>';return;}
   document.title=post.title+' | Laura’s Lens';main.innerHTML=`<article class="post-body"><a href="#/art-reviews">All Art Reviews</a><h1>${escapeHTML(post.title)}</h1><p class="post-meta">${escapeHTML(dateLabel(post.date))} · Laura DeVito</p><div class="tags">${(post.tags||[]).map(t=>`<a class="tag" href="#/art-reviews?tag=${encodeURIComponent(t)}">${escapeHTML(t)}</a>`).join('')}</div><div class="body-copy">${renderBody(post.body)}</div>${(post.images||[]).filter(i=>imageURL(i.src)).map(i=>`<figure><img src="${imageURL(i.src)}" alt="${escapeHTML(i.alt)}" loading="lazy">${i.caption?`<figcaption>${escapeHTML(i.caption)}</figcaption>`:''}</figure>`).join('')}</article>`;return;}
 }
 // Query parameters belong to the hash route, so tags remain shareable on GitHub Pages.
 if(page.split('?')[0]==='art-reviews'){
  let selected=new URLSearchParams(page.split('?')[1]||'').get('tag'),tags=[...new Set(posts.flatMap(p=>p.tags||[]))].sort(),filtered=selected?posts.filter(p=>(p.tags||[]).includes(selected)):posts;
  main.innerHTML=`<section class="page"><div class="page-heading"><div><p class="eyebrow">Looking closer. Thinking out loud.</p><h1>Art Reviews</h1></div><p>Notes on art, exhibitions,<br>and the things that stay with you.</p></div>${tags.length?`<div class="tags" aria-label="Filter reviews by tag"><a class="tag ${!selected?'active':''}" href="#/art-reviews">All reviews</a>${tags.map(t=>`<a class="tag ${selected===t?'active':''}" href="#/art-reviews?tag=${encodeURIComponent(t)}">${escapeHTML(t)}</a>`).join('')}</div>`:''}${filtered.length?`<div class="posts">${filtered.map(p=>`<article class="post-card"><a href="#/art-reviews/${encodeURIComponent(p.id)}">${p.images?.[0]&&imageURL(p.images[0].src)?`<img src="${imageURL(p.images[0].src)}" alt="${escapeHTML(p.images[0].alt)}" loading="lazy">`:''}<span class="post-meta">${escapeHTML(dateLabel(p.date))}</span><h2>${escapeHTML(p.title)}</h2><p>${escapeHTML(p.excerpt||p.body.slice(0,170))}</p></a><div class="tags">${(p.tags||[]).map(t=>`<a class="tag" href="#/art-reviews?tag=${encodeURIComponent(t)}">${escapeHTML(t)}</a>`).join('')}</div></article>`).join('')}</div>`:`<div class="empty"><span class="empty-mark" aria-hidden="true">✳</span><div><h2>${loadFailed?'Reviews couldn’t load.':selected?'Nothing with this tag yet.':'A closer look is on its way.'}</h2><p>${loadFailed?'Please refresh to try again.':selected?'<a href="#/art-reviews">See all reviews</a>':'Art reviews will appear here.'}</p></div></div>`}</section>`;return;
 }
 main.innerHTML='<section class="page"><h1>Lost in looking?</h1><p><a href="#/">Back to Laura’s Lens</a></p></section>';
}
document.getElementById('year').textContent=new Date().getFullYear();
window.addEventListener('hashchange',()=>{render();main.focus({preventScroll:true});window.scrollTo(0,0);});
render();fetch('posts.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('load');return r.json();}).then(data=>{if(!Array.isArray(data))throw Error('format');posts=data.filter(p=>p&&typeof p.id==='string'&&typeof p.title==='string'&&typeof p.body==='string').sort((a,b)=>b.date.localeCompare(a.date));render();}).catch(()=>{loadFailed=true;render();});
</script></body></html>
